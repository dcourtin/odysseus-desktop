[workspace]
resolver = "3"
members = ["common", "shell-bar", "launcher", "compositor", "files", "lock", "notify", "control", "preview", "sysmon", "settings", "mcp", "assistant", "auto", "partage", "trousseau", "notes", "veille"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
common = { path = "common" }
smithay-client-toolkit = "0.19"
fontdue = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dbus = "0.9"

[profile.release]
lto = "thin"
codegen-units = 4
