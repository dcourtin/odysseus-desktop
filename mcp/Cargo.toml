[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "odysseus-mcp : le bureau odysseus exposé aux agents (Model Context Protocol)"

[lib]
name = "mcp"
path = "src/lib.rs"

[[bin]]
name = "odysseus-mcp"
path = "src/main.rs"

[dependencies]
common.workspace = true
serde_json.workspace = true
dbus.workspace = true
chrono.workspace = true
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
